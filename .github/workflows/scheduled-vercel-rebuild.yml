name: Scheduled Vercel rebuild

on:
  schedule:
    # Runs daily at 03:10 UTC so Hugo can publish articles whose date has passed.
    - cron: "10 3 * * *"
  workflow_dispatch:

jobs:
  rebuild:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Trigger Vercel rebuild
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$VERCEL_DEPLOY_HOOK_URL" ]; then
            curl --fail --silent --show-error --request POST "$VERCEL_DEPLOY_HOOK_URL"
            exit 0
          fi

          git config user.name "Radis de l'Amour"
          git config user.email "phenixwhite@gmail.com"
          git commit --allow-empty -m "chore: trigger scheduled Vercel rebuild"
          git push origin HEAD:main
