{{ $htmlLang := cond (hasPrefix .RelPermalink "/fr/") "fr" "en" }}
<!DOCTYPE html>
<html lang="{{ $htmlLang }}">
<head>
  {{ partial "head.html" . }}
</head>
<body>
  <div class="site-scroll">
    {{ partial "header.html" . }}
    <main>
      {{ block "main" . }}{{ end }}
    </main>
    {{ partial "footer.html" . }}
  </div>
</body>
</html>
